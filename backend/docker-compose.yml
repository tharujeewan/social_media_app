services:

  # ─────────────────────────────────────────────────────────
  # PostgreSQL Database Service
  # ─────────────────────────────────────────────────────────
  db:
    # official lightweight postgres image
    image: postgres:16-alpine

    container_name: connectify_db

    # restart automatically if crashes or server reboots
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-0772}
      POSTGRES_DB: ${POSTGRES_DB:-social_media_app}

    # persist database data even if container is removed
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # expose postgres port
    ports:
      - "5432:5432"

    # wait until postgres is ready before starting api
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-social_media_app}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - connectify_net

  # ─────────────────────────────────────────────────────────
  # Node.js Backend API Service
  # ─────────────────────────────────────────────────────────
  api:
    # pull image from Docker Hub (pushed by GitHub Actions)
    image: ${DOCKERHUB_USERNAME}/social-media-backend:latest

    container_name: connectify_api

    restart: unless-stopped

    # only start after database is healthy
    depends_on:
      db:
        condition: service_healthy

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}

      # 'db' is the service name — not localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-0772}@db:5432/${POSTGRES_DB:-social_media_app}

      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}

      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-10}

      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}

    # don't expose api port directly — nginx handles this
    expose:
      - "3000"

    # mount prisma folder for migrations
    volumes:
      - ./prisma:/app/prisma:ro

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - connectify_net

  # ─────────────────────────────────────────────────────────
  # Nginx Reverse Proxy
  # forwards port 80 traffic to api container
  # ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine

    container_name: connectify_nginx

    restart: unless-stopped

    # expose port 80 to the world
    ports:
      - "80:80"

    # mount nginx config from repo into container
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    # only start after api is healthy
    depends_on:
      api:
        condition: service_healthy

    networks:
      - connectify_net

# ─────────────────────────────────────────────────────────
# Persistent volumes
# ─────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: connectify_postgres_data

# ─────────────────────────────────────────────────────────
# Custom network for container communication
# ─────────────────────────────────────────────────────────
networks:
  connectify_net:
    name: connectify_network
    driver: bridge